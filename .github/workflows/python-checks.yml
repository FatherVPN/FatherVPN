name: Python syntax checks
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all active Python entry points
        run: python -m py_compile bot.py core.py smart_webapp.py telegram_admin_auth.py telegram_bot_v6.py miniapp.py
