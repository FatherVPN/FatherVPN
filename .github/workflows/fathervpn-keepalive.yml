name: FatherVPN keepalive
on:
  push:
    branches:
      - main
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fathervpn-keepalive
  cancel-in-progress: false

jobs:
  visit-homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Open the actual homepage and verify HTML
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --location --silent --show-error --fail \
            --retry 2 --retry-delay 3 --connect-timeout 15 --max-time 90 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36' \
            --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            --output "$body" --write-out '%{http_code}' \
            'https://fathervpn.onrender.com/')
          test "$status" = "200"
          grep -qi 'FatherVPN' "$body"
          echo "Homepage visited successfully: HTTP $status; HTML contains FatherVPN."
