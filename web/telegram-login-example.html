<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FatherVPN — вход через Telegram</title>
<h1>Вход через Telegram</h1>
<p>Настрой домен через @BotFather → /setdomain. Замени имя бота и URL API на свои.</p>
<script async src="https://telegram.org/js/telegram-widget.js?22"
 data-telegram-login="Father_VPNs_bot" data-size="large" data-userpic="false"
 data-onauth="onTelegramAuth(user)"></script>
<pre id="status">Ожидание авторизации…</pre>
<script>
async function onTelegramAuth(user) {
 const status = document.getElementById('status');
 status.textContent = 'Проверка подписи…';
 try {
  const response = await fetch('https://your-domain.example/api/telegram/auth', {
   method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(user)
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.detail || 'Не удалось войти');
  // Только демонстрация. Для production используйте Secure/HttpOnly/SameSite cookie.
  window.fatherVpnToken = result.access_token;
  status.textContent = 'Авторизация успешна. Токен хранится в памяти страницы.';
 } catch (e) { status.textContent = 'Ошибка входа: ' + e.message; }
}
</script></html>
